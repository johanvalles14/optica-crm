services:
  postgres:
    image: postgres:16-alpine
    container_name: optica-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optica_crm}
      POSTGRES_USER: ${POSTGRES_USER:-optica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OPTICA_CRM_DB_PORT:-5432}:5432"
    volumes:
      - "${OPTICA_CRM_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optica -d optica_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
