services:
  postgres:
    image: postgres:16-alpine
    container_name: optica-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: optica_crm
      POSTGRES_USER: optica
      POSTGRES_PASSWORD: optica_dev_only
    ports:
      - "5432:5432"
    volumes:
      - optica-crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optica -d optica_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  optica-crm-postgres-data:
