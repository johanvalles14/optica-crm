services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optica-crm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_MODE: ${AUTH_MODE:-supabase}
      DATABASE_URL: postgresql://${POSTGRES_USER:-optica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-optica_crm}?schema=public
      SUPABASE_URL: ${SUPABASE_URL:?Define SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Define SUPABASE_PUBLISHABLE_KEY in .env}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY}}
    ports:
      - "${OPTICA_CRM_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: optica-crm-setup
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-optica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-optica_crm}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optica -d optica_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
