services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optica-crm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://optica:optica_dev_only@postgres:5432/optica_crm?schema=public
    ports:
      - "${OPTICA_CRM_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: optica-crm-setup
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://optica:optica_dev_only@postgres:5432/optica_crm?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optica -d optica_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
